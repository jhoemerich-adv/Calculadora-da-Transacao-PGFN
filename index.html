<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simulador de Transação Tributária PGFN — Patussi Emerich Advocacia</title>
<meta name="description" content="Simule o desconto e as condições de parcelamento da sua dívida com a União, com base no Edital PGFN nº 6/2026." />

<!-- React + ReactDOM + Babel (permitem rodar JSX direto no navegador, sem passo de build) -->
<!-- Versões fixadas propositalmente (evita que uma atualização do CDN quebre o site) -->
<script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
</style>
</head>
<body>

<div id="root">
  <div style="max-width:560px;margin:60px auto;padding:24px;font-family:Arial,sans-serif;color:#63666A;text-align:center;">
    Carregando simulador...
  </div>
</div>

<div id="erro-visivel" style="display:none;max-width:560px;margin:24px auto;padding:20px;font-family:Arial,sans-serif;background:#FDEDED;color:#9A2A2A;border:1px solid #F3C6C6;border-radius:8px;"></div>

<script>
  // Captura qualquer erro de JS (incluindo falha de carregamento de script/CDN)
  // e exibe direto na tela, já que no celular não há acesso fácil ao console.
  window.onerror = function (mensagem, origem, linha, coluna, erro) {
    var caixa = document.getElementById("erro-visivel");
    if (caixa) {
      caixa.style.display = "block";
      caixa.innerHTML =
        "<strong>Erro ao carregar o simulador:</strong><br>" +
        mensagem +
        "<br><small>Arquivo: " + origem + " (linha " + linha + ")</small>";
    }
  };
</script>

<!--
  ============================================================
  CONFIGURAÇÃO OBRIGATÓRIA ANTES DE PUBLICAR
  ============================================================
  Troque a URL abaixo pela URL do seu Google Apps Script publicado
  como Web App (veja o passo a passo fornecido separadamente).
  Sem isso, o formulário não vai conseguir salvar os leads.
-->
<script>
  window.APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwNq_8eBMGSU6uY9Bo207p2A-DqUboh90rlNbfM_5JHcMfAMudDZOvNY9VTSFJV72xaRA/exec";
</script>

<script type="text/babel" data-presets="react">
const { useState } = React;

// ============================================================
// Simulador de Transação Tributária PGFN — Patussi Emerich
// Base normativa: Edital PGFN nº 6/2026 (DOU 01/06/2026, Seção 3)
// Adesão: 01/06/2026 a 30/09/2026
// ============================================================

const AZUL = "#002554";
const CINZA = "#63666A";

// ---- Regras extraídas literalmente do Edital nº 6/2026 ----
// CAPAG = Transação por Capacidade de Pagamento (Cap. III, Seção I)
// IRREC = Transação de Débitos Irrecuperáveis (Cap. III, Seção II)
const REGRAS = {
  capag: {
    geral: { entrada: 6, parcelasEntrada: 6, parcelasSaldo: 114, descontoMax: 65 },
    pf_me_epp: { entrada: 6, parcelasEntrada: 12, parcelasSaldo: 133, descontoMax: 70 },
  },
  irrec: {
    geral: { entrada: 5, parcelasEntrada: 12, parcelasSaldo: 108, descontoMax: 65 },
    pf_me_epp: { entrada: 5, parcelasEntrada: 12, parcelasSaldo: 133, descontoMax: 70 },
  },
};

const LIMITE_VALOR = 45000000; // Art. 2º

// TROQUE pelo número de WhatsApp do escritório (DDI 55 + DDD + número, só dígitos)
const WHATSAPP_NUMERO = "5544988553443";

function detectarPerfil(doc) {
  const digits = doc.replace(/\D/g, "");
  if (digits.length === 11) return "PF";
  if (digits.length === 14) return "PJ";
  return null;
}

function formatarDocumento(v) {
  const d = v.replace(/\D/g, "").slice(0, 14);
  if (d.length <= 11) {
    return d
      .replace(/(\d{3})(\d)/, "$1.$2")
      .replace(/(\d{3})(\d)/, "$1.$2")
      .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
  }
  return d
    .replace(/(\d{2})(\d)/, "$1.$2")
    .replace(/(\d{3})(\d)/, "$1.$2")
    .replace(/(\d{3})(\d)/, "$1/$2")
    .replace(/(\d{4})(\d{1,2})$/, "$1-$2");
}

function formatarMoeda(v) {
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

// Máscara monetária: trata a digitação como centavos, formatando em tempo
// real como "R$ 10.000.000,00" (padrão de apps bancários).
function aplicarMascaraMoeda(str) {
  const digits = str.replace(/\D/g, "");
  if (!digits) return "";
  const numero = parseInt(digits, 10) / 100;
  return numero.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL",
  });
}

function parseValor(str) {
  // O campo sempre chega já mascarado (ex: "R$ 10.000.000,00"), então
  // extraímos os dígitos brutos e dividimos por 100 (mesma lógica da máscara).
  const digits = str.replace(/\D/g, "");
  if (!digits) return 0;
  return parseInt(digits, 10) / 100;
}

function calcularCenarios(valor, regra) {
  const descontos = [
    { label: "Máximo estimado", pct: regra.descontoMax },
    { label: "Intermediário", pct: Math.round(regra.descontoMax * 0.6) },
    { label: "Conservador", pct: Math.round(regra.descontoMax * 0.3) },
  ];
  return descontos.map((d) => {
    const valorComDesconto = valor * (1 - d.pct / 100);
    const entrada = valorComDesconto * (regra.entrada / 100);
    const saldo = valorComDesconto - entrada;
    const totalParcelas = regra.parcelasEntrada + regra.parcelasSaldo;
    const parcelaEntrada = entrada / regra.parcelasEntrada;
    const parcelaSaldo = saldo / regra.parcelasSaldo;
    return {
      ...d,
      regra,
      valorComDesconto,
      entrada,
      parcelaEntrada,
      parcelaSaldo,
      totalParcelas,
      economiza: valor - valorComDesconto,
    };
  });
}

const TIPOS_DEBITO = [
  { id: "irrec", label: "Minha empresa está parada, baixada ou fechada" },
  { id: "capag", label: "Minha empresa está em funcionamento, faturando normalmente" },
];

// ---- Persistência via Google Apps Script (substitui window.storage do Claude) ----
async function salvarLeadRemoto(lead) {
  const url = window.APPS_SCRIPT_URL;
  if (!url || url.indexOf("COLE_AQUI") !== -1) {
    throw new Error("URL do Google Apps Script não configurada.");
  }
  // Apps Script Web Apps exigem 'text/plain' para evitar preflight CORS bloqueado.
  const resposta = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(lead),
  });
  if (!resposta.ok) {
    throw new Error("Falha ao enviar dados (HTTP " + resposta.status + ")");
  }
  return true;
}

function App() {
  const [etapa, setEtapa] = useState("form");
  const [valor, setValor] = useState("");
  const [documento, setDocumento] = useState("");
  const [tipoDebito, setTipoDebito] = useState("capag");
  const [perfil, setPerfil] = useState(null);
  const [meEpp, setMeEpp] = useState(null);
  const [erro, setErro] = useState("");
  const [nome, setNome] = useState("");
  const [telefone, setTelefone] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [cenarios, setCenarios] = useState([]);
  const [regraUsada, setRegraUsada] = useState(null);

  function handleDocumentoChange(v) {
    const formatted = formatarDocumento(v);
    setDocumento(formatted);
    const p = detectarPerfil(formatted);
    setPerfil(p);
    if (p !== "PJ") setMeEpp(null);
  }

  function simular() {
    setErro("");
    const valorNum = parseValor(valor);
    const digits = documento.replace(/\D/g, "");

    if (!valorNum || valorNum <= 0) {
      setErro("Informe o valor total do débito.");
      return;
    }
    if (digits.length !== 11 && digits.length !== 14) {
      setErro("Informe um CPF (11 dígitos) ou CNPJ (14 dígitos) válido.");
      return;
    }
    if (valorNum > LIMITE_VALOR) {
      setErro(
        "Este edital cobre débitos de até " +
          formatarMoeda(LIMITE_VALOR) +
          " por contribuinte. Fale com um consultor para avaliar seu caso."
      );
      return;
    }

    const perfilDetectado = digits.length === 11 ? "PF" : "PJ";
    setPerfil(perfilDetectado);

    if (perfilDetectado === "PJ" && meEpp === null) {
      setErro("Informe se a empresa se enquadra como Microempresa ou Empresa de Pequeno Porte.");
      return;
    }

    // PF sempre cai na regra específica (mais favorável, Art. 5º/9º do Edital).
    // PJ: regra específica se ME/EPP confirmado; caso contrário, regra geral (Art. 4º/7º).
    const grupo = tipoDebito === "irrec" ? "irrec" : "capag";
    const usaRegraEspecifica = perfilDetectado === "PF" || (perfilDetectado === "PJ" && meEpp === true);
    const regra = usaRegraEspecifica ? REGRAS[grupo].pf_me_epp : REGRAS[grupo].geral;

    setRegraUsada({ grupo, regra, perfil: perfilDetectado, meEpp: perfilDetectado === "PJ" ? meEpp : null });
    setCenarios(calcularCenarios(valorNum, regra));
    setEtapa("resultado");
  }

  async function salvarLead() {
    if (!nome.trim() || telefone.replace(/\D/g, "").length < 10) {
      setErro("Informe nome e um telefone válido com DDD.");
      return;
    }
    setErro("");
    setSalvando(true);
    const lead = {
      nome: nome.trim(),
      telefone,
      documento,
      perfil,
      meEpp: regraUsada && regraUsada.meEpp != null ? regraUsada.meEpp : null,
      tipoDebito,
      valorInformado: parseValor(valor),
      cenarioMaxPct: cenarios[0] ? cenarios[0].pct : null,
      data: new Date().toISOString(),
    };

    let salvo = false;
    let ultimoErro = null;
    for (let tentativa = 0; tentativa < 2 && !salvo; tentativa++) {
      try {
        await salvarLeadRemoto(lead);
        salvo = true;
      } catch (e) {
        ultimoErro = e;
        if (tentativa === 0) await new Promise((r) => setTimeout(r, 600));
      }
    }

    if (salvo) {
      setEtapa("concluido");
    } else {
      console.error("Falha ao salvar lead após tentativas:", ultimoErro, lead);
      setErro(
        "Não foi possível registrar seus dados agora (" +
          (ultimoErro && ultimoErro.message ? ultimoErro.message : "erro desconhecido") +
          "). Tente novamente em instantes."
      );
    }
    setSalvando(false);
  }

  return (
    <div style={styles.page}>
      <div style={styles.container}>
        <Header />

        {etapa === "form" && (
          <FormEtapa
            valor={valor}
            setValor={setValor}
            documento={documento}
            onDocumentoChange={handleDocumentoChange}
            perfil={perfil}
            tipoDebito={tipoDebito}
            setTipoDebito={setTipoDebito}
            meEpp={meEpp}
            setMeEpp={setMeEpp}
            erro={erro}
            onSimular={simular}
          />
        )}

        {etapa === "resultado" && (
          <ResultadoEtapa
            valorOriginal={parseValor(valor)}
            cenarios={cenarios}
            regraUsada={regraUsada}
            onAvancar={() => setEtapa("captura")}
            onVoltar={() => setEtapa("form")}
          />
        )}

        {etapa === "captura" && (
          <CapturaEtapa
            nome={nome}
            setNome={setNome}
            telefone={telefone}
            setTelefone={setTelefone}
            erro={erro}
            salvando={salvando}
            onSalvar={salvarLead}
            onVoltar={() => setEtapa("resultado")}
          />
        )}

        {etapa === "concluido" && (
          <ConcluidoEtapa
            nome={nome}
            telefone={telefone}
            valor={valor}
            cenarios={cenarios}
            regraUsada={regraUsada}
          />
        )}

        <Footer />
      </div>
    </div>
  );
}

function Header() {
  return (
    <div style={styles.header}>
      <img src="logo-patussi-emerich.png" alt="Patussi Emerich Advocacia" style={styles.logoImg} />
    </div>
  );
}

function FormEtapa({
  valor,
  setValor,
  documento,
  onDocumentoChange,
  perfil,
  tipoDebito,
  setTipoDebito,
  meEpp,
  setMeEpp,
  erro,
  onSimular,
}) {
  return (
    <div style={styles.card}>
      <h1 style={styles.h1}>Quanto você pode economizar na sua dívida com a União?</h1>
      <p style={styles.lead}>
        Simule agora, com base no Edital PGFN nº 6/2026, o desconto e as condições de
        parcelamento estimadas para o seu débito inscrito em Dívida Ativa.
      </p>

      <label style={styles.label}>Valor total do débito</label>
      <input
        style={styles.input}
        inputMode="numeric"
        placeholder="R$ 0,00"
        value={valor}
        onChange={(e) => setValor(aplicarMascaraMoeda(e.target.value))}
      />

      <label style={styles.label}>CPF ou CNPJ</label>
      <input
        style={styles.input}
        inputMode="numeric"
        placeholder="Digite seu CPF ou CNPJ"
        value={documento}
        onChange={(e) => onDocumentoChange(e.target.value)}
      />
      {perfil && (
        <div style={styles.perfilTag}>
          Identificado como {perfil === "PF" ? "Pessoa Física" : "Pessoa Jurídica"}
        </div>
      )}

      {perfil === "PJ" && (
        <>
          <label style={styles.label}>
            A empresa se enquadra como Microempresa (ME) ou Empresa de Pequeno Porte (EPP)?
          </label>
          <div style={styles.radioGroup}>
            {[
              { valor: true, texto: "Sim, é ME ou EPP" },
              { valor: false, texto: "Não / não sei — empresa de porte maior" },
            ].map((op) => (
              <label
                key={String(op.valor)}
                style={{
                  ...styles.radioOption,
                  borderColor: meEpp === op.valor ? AZUL : "#E3E3E5",
                  background: meEpp === op.valor ? "#F3F6FA" : "#fff",
                }}
              >
                <input
                  type="radio"
                  name="meEpp"
                  checked={meEpp === op.valor}
                  onChange={() => setMeEpp(op.valor)}
                  style={{ marginRight: 10 }}
                />
                {op.texto}
              </label>
            ))}
          </div>
          <div style={styles.avisoMini}>
            Esse enquadramento amplia o limite de desconto e o número de parcelas conforme
            o Edital PGFN nº 6/2026. A confirmação definitiva do porte é feita pela PGFN.
          </div>
        </>
      )}

      {perfil === "PJ" && (
        <>
          <label style={styles.label}>Qual a situação da empresa?</label>
          <div style={styles.radioGroup}>
            {TIPOS_DEBITO.map((t) => (
              <label
                key={t.id}
                style={{
                  ...styles.radioOption,
                  borderColor: tipoDebito === t.id ? AZUL : "#E3E3E5",
                  background: tipoDebito === t.id ? "#F3F6FA" : "#fff",
                }}
              >
                <input
                  type="radio"
                  name="tipoDebito"
                  checked={tipoDebito === t.id}
                  onChange={() => setTipoDebito(t.id)}
                  style={{ marginRight: 10 }}
                />
                {t.label}
              </label>
            ))}
          </div>
        </>
      )}

      {erro && <div style={styles.erro}>{erro}</div>}

      <button style={styles.botaoPrimario} onClick={onSimular}>
        Simular minha economia
      </button>

      <div style={styles.disclaimerMini}>
        Simulação preliminar e educativa. Não substitui análise técnica do escritório
        nem constitui proposta vinculante da PGFN.
      </div>
    </div>
  );
}

function ResultadoEtapa({ valorOriginal, cenarios, regraUsada, onAvancar, onVoltar }) {
  const modalidadeLabel =
    regraUsada && regraUsada.grupo === "capag"
      ? "Transação por Capacidade de Pagamento"
      : "Transação de Débitos Irrecuperáveis";

  return (
    <div style={styles.card}>
      <button style={styles.linkVoltar} onClick={onVoltar}>
        ← Ajustar dados
      </button>
      <h2 style={styles.h2}>Sua simulação — {modalidadeLabel}</h2>
      <p style={styles.leadSmall}>
        Débito informado: <strong>{formatarMoeda(valorOriginal)}</strong> ·{" "}
        Perfil:{" "}
        <strong>
          {regraUsada && regraUsada.perfil === "PF"
            ? "Pessoa Física"
            : regraUsada && regraUsada.meEpp === true
            ? "Pessoa Jurídica (ME/EPP)"
            : "Pessoa Jurídica"}
        </strong>
      </p>

      <div style={styles.cenariosGrid}>
        {cenarios.map((c, i) => (
          <div
            key={i}
            style={{
              ...styles.cenarioCard,
              borderTop: "4px solid " + (i === 0 ? "#2E7D32" : i === 1 ? "#B7860B" : CINZA),
            }}
          >
            <div style={styles.cenarioLabel}>{c.label}</div>
            <div style={styles.cenarioDesconto}>{c.pct}% de desconto</div>
            <div style={styles.cenarioLinha}>
              <span>Valor com desconto</span>
              <strong>{formatarMoeda(c.valorComDesconto)}</strong>
            </div>
            <div style={styles.cenarioLinha}>
              <span>Entrada ({c.regra.parcelasEntrada}x)</span>
              <strong>{formatarMoeda(c.parcelaEntrada)}/mês</strong>
            </div>
            <div style={styles.cenarioLinha}>
              <span>Saldo ({c.regra.parcelasSaldo}x)</span>
              <strong>{formatarMoeda(c.parcelaSaldo)}/mês</strong>
            </div>
            <div style={styles.cenarioLinha}>
              <span>Total de parcelas</span>
              <strong>
                {c.regra.parcelasEntrada} + {c.regra.parcelasSaldo} = até {c.totalParcelas}x
              </strong>
            </div>
            <div style={styles.cenarioEconomia}>
              Economia estimada: {formatarMoeda(c.economiza)}
            </div>
          </div>
        ))}
      </div>

      <div style={styles.ressalvas}>
        <strong>Leia antes de continuar:</strong>
        <ol style={styles.ressalvasLista}>
          <li>
            Os percentuais exibidos são os limites e condições previstos no Edital PGFN nº
            6/2026 para o perfil informado — o desconto efetivo depende da capacidade de
            pagamento real, apurada de forma sigilosa pela PGFN via REGULARIZE.
          </li>
          <li>
            Esta simulação não constitui proposta vinculante da PGFN nem parecer jurídico
            definitivo sobre o seu caso.
          </li>
          <li>
            A adesão ao Edital nº 6/2026 está aberta até 30/09/2026, das 08h às 19h
            (horário de Brasília), exclusivamente pelo portal REGULARIZE.
          </li>
        </ol>
      </div>

      <button style={styles.botaoPrimario} onClick={onAvancar}>
        Quero confirmar o desconto real do meu caso
      </button>
    </div>
  );
}

function CapturaEtapa({
  nome,
  setNome,
  telefone,
  setTelefone,
  erro,
  salvando,
  onSalvar,
  onVoltar,
}) {
  function handleTelefone(v) {
    const d = v.replace(/\D/g, "").slice(0, 11);
    let out = d;
    if (d.length > 2) out = "(" + d.slice(0, 2) + ") " + d.slice(2);
    if (d.length > 7) out = "(" + d.slice(0, 2) + ") " + d.slice(2, 7) + "-" + d.slice(7);
    setTelefone(out);
  }

  return (
    <div style={styles.card}>
      <button style={styles.linkVoltar} onClick={onVoltar}>
        ← Ver simulação novamente
      </button>
      <h2 style={styles.h2}>Fale com um consultor tributário</h2>
      <p style={styles.leadSmall}>
        Um advogado do escritório confirma o desconto real do seu caso e te orienta sobre
        os próximos passos, sem compromisso.
      </p>

      <label style={styles.label}>Nome completo</label>
      <input
        style={styles.input}
        placeholder="Seu nome"
        value={nome}
        onChange={(e) => setNome(e.target.value)}
      />

      <label style={styles.label}>Telefone com DDD</label>
      <input
        style={styles.input}
        inputMode="tel"
        placeholder="(00) 00000-0000"
        value={telefone}
        onChange={(e) => handleTelefone(e.target.value)}
      />

      {erro && <div style={styles.erro}>{erro}</div>}

      <button style={styles.botaoPrimario} onClick={onSalvar} disabled={salvando}>
        {salvando ? "Enviando..." : "Quero tirar dúvidas com um consultor"}
      </button>

      <div style={styles.disclaimerMini}>
        Seus dados são usados apenas para retorno do escritório Patussi Emerich Advocacia.
      </div>
    </div>
  );
}

function ConcluidoEtapa({ nome, telefone, valor, cenarios, regraUsada }) {
  const primeiroNome = nome.split(" ")[0];
  const descontoMax = cenarios[0] ? cenarios[0].pct : null;
  const modalidadeLabel =
    regraUsada && regraUsada.grupo === "capag"
      ? "Capacidade de Pagamento"
      : "Débitos Irrecuperáveis";

  const mensagem =
    "Olá! Sou " + nome + " e acabei de simular minha transação tributária no site. " +
    "Débito informado: " + formatarMoeda(parseValor(valor)) + ", modalidade " + modalidadeLabel +
    (descontoMax != null ? ", desconto máximo estimado de " + descontoMax + "%" : "") +
    ". Gostaria de conversar com um consultor.";

  const linkWhatsApp =
    "https://wa.me/" + WHATSAPP_NUMERO + "?text=" + encodeURIComponent(mensagem);

  return (
    <div style={styles.card}>
      <div style={styles.checkCircle}>✓</div>
      <h2 style={{ ...styles.h2, textAlign: "center" }}>
        Recebemos seus dados, {primeiroNome}!
      </h2>
      <p style={{ ...styles.leadSmall, textAlign: "center" }}>
        Um consultor tributário do escritório entrará em contato em breve para confirmar
        as condições reais da sua transação com a PGFN.
      </p>
      <a
        href={linkWhatsApp}
        target="_blank"
        rel="noopener noreferrer"
        style={styles.botaoWhatsApp}
      >
        Falar agora pelo WhatsApp
      </a>
